# ========================================================
# FoodExpress Test Properties (In-Memory H2 for Tests)
# Used during `mvn test` stage in Jenkins and local testing
# ========================================================

spring.datasource.url=jdbc:h2:mem:foodexpress_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=never

app.jwt.secret=FoodExpressSuperSecretSigningKeyForJwtSecurityTokens2026SecureKeyWithAtLeast256BitsLength
app.jwt.expiration-ms=3600000
