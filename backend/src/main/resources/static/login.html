<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <nav id="main-nav" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm"></nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="custom-card p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-utensils text-danger fa-3x mb-2"></i>
                        <h3 class="fw-bold">Sign In to FoodExpress</h3>
                        <p class="text-muted">Enter your credentials to access your account</p>
                    </div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" id="email" class="form-control" required placeholder="name@example.com">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" id="password" class="form-control" required placeholder="••••••••">
                            </div>
                        </div>

                        <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 mb-3">Sign In</button>
                    </form>

                    <hr>

                    <!-- Quick Demo Accounts for College Demo / Evaluators -->
                    <div class="mb-3 text-center">
                        <small class="text-muted fw-bold d-block mb-2">ONE-CLICK DEMO LOGIN ACCOUNTS</small>
                        <div class="d-flex flex-wrap gap-2 justify-content-center">
                            <button class="btn btn-outline-danger btn-sm" onclick="quickFill('customer@foodexpress.com', 'Customer@123')">
                                <i class="fas fa-user me-1"></i> Customer
                            </button>
                            <button class="btn btn-outline-primary btn-sm" onclick="quickFill('manager@spicytreats.com', 'Partner@123')">
                                <i class="fas fa-store me-1"></i> Restaurant Admin
                            </button>
                            <button class="btn btn-outline-success btn-sm" onclick="quickFill('courier@foodexpress.com', 'Courier@123')">
                                <i class="fas fa-motorcycle me-1"></i> Courier
                            </button>
                            <button class="btn btn-outline-dark btn-sm" onclick="quickFill('admin@foodexpress.com', 'Admin@123')">
                                <i class="fas fa-user-shield me-1"></i> Admin
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <p class="text-muted small mb-0">Don't have an account? <a href="/register.html" class="text-danger fw-bold text-decoration-none">Create Account</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        function quickFill(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            document.getElementById('login-form').dispatchEvent(new Event('submit'));
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

            try {
                const data = await apiCall('/auth/login', 'POST', { email, password });
                Auth.setToken(data.token);
                Auth.setUser({
                    id: data.userId,
                    fullName: data.fullName,
                    email: data.email,
                    role: data.role
                });

                showToast(`Welcome back, ${data.fullName}!`, 'success');

                setTimeout(() => {
                    if (data.role === 'ROLE_SYSTEM_ADMIN') {
                        window.location.href = '/admin/dashboard.html';
                    } else if (data.role === 'ROLE_RESTAURANT_ADMIN') {
                        window.location.href = '/restaurant/dashboard.html';
                    } else if (data.role === 'ROLE_DELIVERY_PARTNER') {
                        window.location.href = '/delivery/dashboard.html';
                    } else {
                        window.location.href = '/restaurants.html';
                    }
                }, 800);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        });
    </script>
</body>
</html>
