<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Order Tracking - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <nav id="main-nav" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm"></nav>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div id="tracking-card" class="custom-card p-4">
                    <div class="text-center py-5">
                        <div class="spinner-border text-danger" role="status"></div>
                        <p class="text-muted mt-2">Connecting to live tracking...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderNumber = urlParams.get('orderNumber');

        if (!orderNumber) {
            window.location.href = '/orders.html';
        }

        const STEPS = [
            { key: 'PLACED', label: 'Order Placed', icon: 'fa-check' },
            { key: 'ACCEPTED', label: 'Accepted', icon: 'fa-thumbs-up' },
            { key: 'PREPARING', label: 'In Kitchen', icon: 'fa-fire' },
            { key: 'READY_FOR_PICKUP', label: 'Ready', icon: 'fa-box' },
            { key: 'OUT_FOR_DELIVERY', label: 'On The Way', icon: 'fa-motorcycle' },
            { key: 'DELIVERED', label: 'Delivered', icon: 'fa-home' }
        ];

        function getStepIndex(status) {
            switch (status) {
                case 'PLACED': return 0;
                case 'ACCEPTED': return 1;
                case 'PREPARING': return 2;
                case 'READY_FOR_PICKUP':
                case 'DELIVERY_PARTNER_ASSIGNED': return 3;
                case 'PICKED_UP':
                case 'OUT_FOR_DELIVERY': return 4;
                case 'DELIVERED': return 5;
                default: return 0;
            }
        }

        async function fetchTracking() {
            try {
                const order = await apiCall(`/orders/track/${orderNumber}`);
                const card = document.getElementById('tracking-card');

                if (order.status === 'CANCELLED' || order.status === 'REJECTED') {
                    card.innerHTML = `
                        <div class="text-center py-4">
                            <i class="fas fa-times-circle fa-4x text-danger mb-3"></i>
                            <h3 class="fw-bold">Order ${order.status}</h3>
                            <p class="text-muted">Order #${order.orderNumber} has been ${order.status.toLowerCase()}.</p>
                            <a href="/restaurants.html" class="btn btn-primary px-4 mt-2">Order Again</a>
                        </div>
                    `;
                    return;
                }

                const currentIdx = getStepIndex(order.status);
                let stepperHtml = '<div class="order-stepper">';
                STEPS.forEach((step, idx) => {
                    let stateClass = '';
                    if (idx < currentIdx) stateClass = 'completed';
                    else if (idx === currentIdx) stateClass = 'active';

                    stepperHtml += `
                        <div class="step-item ${stateClass}">
                            <div class="step-circle"><i class="fas ${step.icon}"></i></div>
                            <div class="step-label">${step.label}</div>
                        </div>
                    `;
                });
                stepperHtml += '</div>';

                let courierHtml = '';
                if (order.delivery && order.delivery.deliveryPartnerName) {
                    courierHtml = `
                        <div class="alert alert-success d-flex align-items-center mt-4">
                            <i class="fas fa-motorcycle fa-2x me-3 text-success"></i>
                            <div>
                                <h6 class="fw-bold mb-0">Delivery Partner Assigned</h6>
                                <p class="mb-0 small">${order.delivery.deliveryPartnerName} &bull; Call: <strong>${order.delivery.deliveryPartnerPhone || 'Active'}</strong></p>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-3">
                        <div>
                            <span class="badge bg-danger mb-2">LIVE TRACKING</span>
                            <h3 class="fw-bold mb-1">${order.restaurantName}</h3>
                            <p class="text-muted mb-0">Order #${order.orderNumber} &bull; Placed at ${new Date(order.createdAt).toLocaleTimeString()}</p>
                        </div>
                        <div class="text-end">
                            <h4 class="fw-bold text-danger mb-0">₹${order.finalAmount.toFixed(2)}</h4>
                            <small class="text-muted">${order.payment ? order.payment.paymentMethod : 'Paid'}</small>
                        </div>
                    </div>

                    ${stepperHtml}

                    ${courierHtml}

                    <div class="row mt-4 g-3">
                        <div class="col-md-6">
                            <div class="p-3 bg-light rounded h-100">
                                <h6 class="fw-bold"><i class="fas fa-map-marker-alt text-danger me-2"></i>Delivery Address</h6>
                                <p class="small text-muted mb-0">
                                    ${order.address ? `${order.address.street}, ${order.address.city}, ${order.address.state} - ${order.address.postalCode}` : 'Default Address'}
                                </p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="p-3 bg-light rounded h-100">
                                <h6 class="fw-bold"><i class="fas fa-utensils text-primary me-2"></i>Ordered Items</h6>
                                <ul class="list-unstyled small mb-0 text-muted">
                                    ${order.items.map(i => `<li>${i.quantity}x ${i.foodItemName} - ₹${i.subtotal.toFixed(2)}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <small class="text-muted"><i class="fas fa-sync-alt fa-spin me-1"></i> Auto-refreshing status in real-time...</small>
                    </div>
                `;
            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchTracking();
            // Polling interval every 5s for live status update demonstration
            setInterval(fetchTracking, 5000);
        });
    </script>
</body>
</html>
