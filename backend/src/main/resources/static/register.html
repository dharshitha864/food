<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <nav id="main-nav" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm"></nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="custom-card p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus text-danger fa-3x mb-2"></i>
                        <h3 class="fw-bold">Join FoodExpress</h3>
                        <p class="text-muted">Create an account to order food or partner with us</p>
                    </div>

                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" id="fullName" class="form-control" required placeholder="e.g. Rahul Verma">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" id="email" class="form-control" required placeholder="name@example.com">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Password</label>
                                <input type="password" id="password" class="form-control" required minlength="6" placeholder="At least 6 chars">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Phone Number</label>
                                <input type="tel" id="phone" class="form-control" required placeholder="9876543210">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Register As</label>
                            <select id="role" class="form-select">
                                <option value="ROLE_CUSTOMER" selected>Customer (Order Delicious Food)</option>
                                <option value="ROLE_RESTAURANT_ADMIN">Restaurant Partner (List Your Restaurant)</option>
                                <option value="ROLE_DELIVERY_PARTNER">Delivery Courier (Deliver Orders)</option>
                            </select>
                        </div>

                        <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 mb-3">Create My Account</button>
                    </form>

                    <div class="text-center">
                        <p class="text-muted small mb-0">Already registered? <a href="/login.html" class="text-danger fw-bold text-decoration-none">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value.trim();
            const role = document.getElementById('role').value;
            const btn = document.getElementById('submit-btn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registering...';

            try {
                const data = await apiCall('/auth/register', 'POST', { fullName, email, password, phone, role });
                Auth.setToken(data.token);
                Auth.setUser({
                    id: data.userId,
                    fullName: data.fullName,
                    email: data.email,
                    role: data.role
                });

                showToast('Registration successful! Redirecting...', 'success');

                setTimeout(() => {
                    if (data.role === 'ROLE_RESTAURANT_ADMIN') {
                        window.location.href = '/restaurant/dashboard.html';
                    } else if (data.role === 'ROLE_DELIVERY_PARTNER') {
                        window.location.href = '/delivery/dashboard.html';
                    } else {
                        window.location.href = '/restaurants.html';
                    }
                }, 800);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = 'Create My Account';
            }
        });
    </script>
</body>
</html>
