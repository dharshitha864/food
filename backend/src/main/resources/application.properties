# ========================================================
# FoodExpress Application Properties
# ========================================================

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Spring Datasource (MySQL 8)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:foodexpress_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Initialization (Seeds baseline data on startup)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:FoodExpressSuperSecretSigningKeyForJwtSecurityTokens2026SecureKeyWithAtLeast256BitsLength}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.foodexpress=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Swagger & OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

