# ========================================================
# FoodExpress Application Properties
# ========================================================

# Server Configuration (Default port 8085 to avoid conflicts with Jenkins/services on 8080)
server.port=${SERVER_PORT:8085}
server.error.include-message=always
server.error.include-binding-errors=always

# Datasource Configuration:
# Defaults to embedded H2 database (persistent file in ./data) for instant zero-config runs!
# In Docker or production, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_DRIVER, DB_USER, DB_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/foodexpress_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Initialization (Seeds baseline data on startup)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# H2 Console (Accessible at http://localhost:8085/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:FoodExpressSuperSecretSigningKeyForJwtSecurityTokens2026SecureKeyWithAtLeast256BitsLength}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.foodexpress=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Swagger & OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
