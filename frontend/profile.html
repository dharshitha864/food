<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <nav id="main-nav" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm"></nav>

    <div class="container my-4">
        <div class="row">
            <!-- Profile Sidebar -->
            <div class="col-md-4 mb-4">
                <div class="custom-card p-4 text-center">
                    <i class="fas fa-user-circle fa-5x text-danger mb-3"></i>
                    <h4 id="user-display-name" class="fw-bold mb-1">Loading...</h4>
                    <p id="user-display-email" class="text-muted small mb-2">...</p>
                    <span id="user-display-role" class="badge bg-danger">CUSTOMER</span>
                </div>
            </div>

            <!-- Profile Forms -->
            <div class="col-md-8">
                <div class="custom-card p-4 mb-4">
                    <h5 class="fw-bold mb-3"><i class="fas fa-user-edit text-primary me-2"></i>Update Profile Details</h5>
                    <form id="profile-form">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Full Name</label>
                            <input type="text" id="prof-name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email Address</label>
                            <input type="email" id="prof-email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Phone Number</label>
                            <input type="tel" id="prof-phone" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                    </form>
                </div>

                <div class="custom-card p-4 mb-4">
                    <h5 class="fw-bold mb-3"><i class="fas fa-key text-warning me-2"></i>Change Password</h5>
                    <form id="password-form">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Current Password</label>
                            <input type="password" id="curr-password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">New Password</label>
                            <input type="password" id="new-password" class="form-control" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-dark px-4">Update Password</button>
                    </form>
                </div>

                <div class="custom-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0"><i class="fas fa-map-marked-alt text-success me-2"></i>My Saved Addresses</h5>
                    </div>
                    <div id="addresses-list">
                        <div class="spinner-border spinner-border-sm text-danger" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        if (!Auth.isLoggedIn()) {
            window.location.href = '/login.html';
        }

        async function loadProfile() {
            try {
                const p = await apiCall('/profile');
                document.getElementById('user-display-name').textContent = p.fullName;
                document.getElementById('user-display-email').textContent = p.email;
                document.getElementById('user-display-role').textContent = p.role.replace('ROLE_', '');

                document.getElementById('prof-name').value = p.fullName;
                document.getElementById('prof-email').value = p.email;
                document.getElementById('prof-phone').value = p.phone;

                loadAddresses();
            } catch (err) {
                console.error(err);
            }
        }

        async function loadAddresses() {
            const list = document.getElementById('addresses-list');
            try {
                const addrs = await apiCall('/addresses');
                list.innerHTML = '';
                if (addrs.length === 0) {
                    list.innerHTML = '<p class="text-muted small">No saved addresses yet.</p>';
                    return;
                }
                addrs.forEach(a => {
                    list.innerHTML += `
                        <div class="p-3 border rounded mb-2 d-flex justify-content-between align-items-center bg-light">
                            <div>
                                <h6 class="fw-bold mb-0 small">
                                    ${a.default ? '<span class="badge bg-danger me-1">DEFAULT</span>' : ''}
                                    ${a.street}
                                </h6>
                                <small class="text-muted">${a.city}, ${a.state} - ${a.postalCode}</small>
                            </div>
                            <div>
                                ${!a.default ? `<button class="btn btn-outline-secondary btn-sm me-1" onclick="makeDefault(${a.id})">Make Default</button>` : ''}
                                <button class="btn btn-outline-danger btn-sm" onclick="deleteAddr(${a.id})"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {}
        }

        async function makeDefault(id) {
            try {
                await apiCall(`/addresses/${id}/default`, 'PUT');
                showToast('Default address updated', 'success');
                loadAddresses();
            } catch (e) {}
        }

        async function deleteAddr(id) {
            try {
                await apiCall(`/addresses/${id}`, 'DELETE');
                showToast('Address deleted', 'info');
                loadAddresses();
            } catch (e) {}
        }

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('prof-name').value.trim();
            const email = document.getElementById('prof-email').value.trim();
            const phone = document.getElementById('prof-phone').value.trim();
            try {
                const updated = await apiCall('/profile', 'PUT', { fullName, email, phone });
                Auth.setUser({
                    id: updated.id,
                    fullName: updated.fullName,
                    email: updated.email,
                    role: updated.role
                });
                showToast('Profile updated successfully!', 'success');
                renderNavbar();
            } catch (e) {}
        });

        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('curr-password').value;
            const newPassword = document.getElementById('new-password').value;
            try {
                await apiCall('/profile/change-password', 'PUT', { currentPassword, newPassword });
                showToast('Password changed successfully!', 'success');
                document.getElementById('password-form').reset();
            } catch (e) {}
        });

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
