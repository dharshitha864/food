<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Portal - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <nav id="main-nav" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm"></nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-0"><i class="fas fa-motorcycle text-danger me-2"></i>Delivery Courier Portal</h3>
                <p class="text-muted small mb-0">Active assignments, pickup, and delivery fulfillment</p>
            </div>
            <button class="btn btn-outline-danger btn-sm" onclick="loadDeliveries()"><i class="fas fa-sync-alt me-1"></i> Refresh Tasks</button>
        </div>

        <div class="custom-card p-4 mb-4">
            <h5 class="fw-bold mb-3"><i class="fas fa-tasks text-primary me-2"></i>My Delivery Assignments</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Order #</th>
                            <th>Status</th>
                            <th>Assigned At</th>
                            <th>Courier Actions</th>
                        </tr>
                    </thead>
                    <tbody id="deliveries-table">
                        <tr><td colspan="4" class="text-center py-4"><div class="spinner-border text-danger" role="status"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const u = Auth.getUser();
        if (!u || (u.role !== 'ROLE_DELIVERY_PARTNER' && u.role !== 'ROLE_SYSTEM_ADMIN')) {
            alert('Access Denied: Requires Delivery Partner role');
            window.location.href = '/login.html';
        }

        async function loadDeliveries() {
            const table = document.getElementById('deliveries-table');
            try {
                const list = await apiCall('/delivery-partner/assigned');
                table.innerHTML = '';

                if (list.length === 0) {
                    table.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">No active deliveries assigned right now. Check back soon!</td></tr>';
                    return;
                }

                list.forEach(d => {
                    let actionBtn = '';
                    if (d.status === 'ASSIGNED') {
                        actionBtn = `<button class="btn btn-primary btn-sm fw-bold" onclick="markAction(${d.orderId}, 'pickup')">Confirm Picked Up</button>`;
                    } else if (d.status === 'PICKED_UP') {
                        actionBtn = `<button class="btn btn-warning btn-sm fw-bold" onclick="markAction(${d.orderId}, 'out-for-delivery')">Start Transit (Out For Delivery)</button>`;
                    } else if (d.status === 'OUT_FOR_DELIVERY') {
                        actionBtn = `<button class="btn btn-success btn-sm fw-bold" onclick="markAction(${d.orderId}, 'deliver')">Mark Delivered & Collect Cash</button>`;
                    } else if (d.status === 'DELIVERED') {
                        actionBtn = `<span class="badge bg-success">Completed</span>`;
                    }

                    table.innerHTML += `
                        <tr>
                            <td class="fw-bold"><a href="/tracking.html?orderNumber=${d.orderNumber}" class="text-danger text-decoration-none">${d.orderNumber}</a></td>
                            <td><span class="badge bg-dark">${d.status}</span></td>
                            <td>${d.assignedAt ? new Date(d.assignedAt).toLocaleTimeString() : 'Recently'}</td>
                            <td>${actionBtn}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                table.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Failed to load deliveries</td></tr>';
            }
        }

        async function markAction(orderId, action) {
            try {
                await apiCall(`/delivery-partner/orders/${orderId}/${action}`, 'PUT');
                showToast(`Delivery status updated!`, 'success');
                loadDeliveries();
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', loadDeliveries);
    </script>
</body>
</html>
