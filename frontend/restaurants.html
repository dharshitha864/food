<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav id="main-nav" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm"></nav>

    <div class="container my-4">
        <!-- Filter and Search Header -->
        <div class="custom-card p-3 mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                        <input type="text" id="filter-search" class="form-control" placeholder="Search restaurant or dish..." oninput="fetchRestaurants()">
                    </div>
                </div>
                <div class="col-md-3">
                    <select id="filter-category" class="form-select" onchange="fetchRestaurants()">
                        <option value="">All Cuisines / Categories</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="filter-rating" class="form-select" onchange="fetchRestaurants()">
                        <option value="">Any Rating</option>
                        <option value="4.0">⭐ 4.0 & above</option>
                        <option value="4.5">⭐ 4.5 & above</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select id="filter-sort" class="form-select" onchange="fetchRestaurants()">
                        <option value="rating">Sort: Rating</option>
                        <option value="name">Sort: Name (A-Z)</option>
                    </select>
                </div>
            </div>
        </div>

        <h3 class="fw-bold mb-3" id="results-heading">Explore Restaurants</h3>
        <div id="restaurants-grid" class="row g-4">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-danger" role="status"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        // Read URL query params if user came from home search
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('search')) {
            document.getElementById('filter-search').value = urlParams.get('search');
        }

        async function initFilters() {
            try {
                const categories = await apiCall('/categories');
                const catSelect = document.getElementById('filter-category');
                categories.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name;
                    catSelect.appendChild(opt);
                });

                if (urlParams.get('category')) {
                    catSelect.value = urlParams.get('category');
                }

                await fetchRestaurants();
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchRestaurants() {
            const keyword = document.getElementById('filter-search').value.trim();
            const categoryId = document.getElementById('filter-category').value;
            const minRating = document.getElementById('filter-rating').value;
            const sortBy = document.getElementById('filter-sort').value;

            let query = `/restaurants/search?sortBy=${sortBy}`;
            if (keyword) query += `&keyword=${encodeURIComponent(keyword)}`;
            if (categoryId) query += `&categoryId=${categoryId}`;
            if (minRating) query += `&minRating=${minRating}`;

            const grid = document.getElementById('restaurants-grid');
            try {
                const list = await apiCall(query);
                grid.innerHTML = '';

                if (list.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-utensils text-muted fa-4x mb-3"></i>
                            <h5>No restaurants found matching your criteria</h5>
                            <p class="text-muted">Try clearing search filters or search a different keyword.</p>
                        </div>
                    `;
                    return;
                }

                list.forEach(r => {
                    grid.innerHTML += `
                        <div class="col-md-4">
                            <div class="custom-card h-100">
                                <img src="${r.imageUrl || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500'}" class="card-img-top" alt="${r.name}">
                                <div class="card-body p-3">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h5 class="fw-bold mb-0 text-truncate">${r.name}</h5>
                                        <span class="badge-rating"><i class="fas fa-star me-1"></i>${r.rating}</span>
                                    </div>
                                    <p class="text-muted small text-truncate mb-2">${r.description || 'Delicious freshly prepared meals'}</p>
                                    <p class="small text-secondary mb-3"><i class="fas fa-map-marker-alt me-1 text-danger"></i>${r.address}</p>
                                    <a href="/restaurant.html?id=${r.id}" class="btn btn-primary btn-sm w-100">View Menu & Order</a>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                grid.innerHTML = '<div class="col-12 text-center text-danger">Failed to load restaurants</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', initFilters);
    </script>
</body>
</html>
