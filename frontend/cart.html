<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav id="main-nav" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm"></nav>

    <div class="container my-4">
        <h3 class="fw-bold mb-4"><i class="fas fa-shopping-cart text-danger me-2"></i>Your Food Cart</h3>

        <div id="cart-content" class="row">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-danger" role="status"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        if (!Auth.isLoggedIn()) {
            window.location.href = '/login.html';
        }

        async function loadCart() {
            try {
                const cart = await apiCall('/cart');
                const container = document.getElementById('cart-content');

                if (!cart.items || cart.items.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-shopping-basket fa-4x text-muted mb-3"></i>
                            <h4>Your cart is empty!</h4>
                            <p class="text-muted">Looks like you haven't added any items yet.</p>
                            <a href="/restaurants.html" class="btn btn-primary px-4 mt-2">Explore Restaurants</a>
                        </div>
                    `;
                    return;
                }

                let itemsHtml = '';
                cart.items.forEach(item => {
                    itemsHtml += `
                        <div class="d-flex justify-content-between align-items-center py-3 border-bottom">
                            <div class="d-flex align-items-center">
                                <img src="${item.foodItemImage || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100'}" class="rounded-3 me-3" style="width: 60px; height: 60px; object-fit: cover;">
                                <div>
                                    <h6 class="fw-bold mb-1">${item.foodItemName}</h6>
                                    <small class="text-muted">₹${item.unitPrice.toFixed(2)} each</small>
                                </div>
                            </div>
                            <div class="d-flex align-items-center">
                                <div class="btn-group btn-group-sm me-3">
                                    <button class="btn btn-outline-secondary" onclick="updateQty(${item.id}, ${item.quantity - 1})">-</button>
                                    <button class="btn btn-light fw-bold" disabled>${item.quantity}</button>
                                    <button class="btn btn-outline-secondary" onclick="updateQty(${item.id}, ${item.quantity + 1})">+</button>
                                </div>
                                <h6 class="fw-bold mb-0 me-3" style="min-width: 70px; text-align: right;">₹${item.subtotal.toFixed(2)}</h6>
                                <button class="btn btn-outline-danger btn-sm" onclick="removeItem(${item.id})"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = `
                    <div class="col-lg-8 mb-4">
                        <div class="custom-card p-4">
                            <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
                                <h5 class="fw-bold mb-0"><i class="fas fa-store me-2 text-primary"></i>${cart.restaurantName}</h5>
                                <button class="btn btn-outline-secondary btn-sm" onclick="clearCart()"><i class="fas fa-trash me-1"></i>Clear Cart</button>
                            </div>
                            ${itemsHtml}
                            <div class="mt-3">
                                <a href="/restaurant.html?id=${cart.restaurantId}" class="text-danger fw-bold text-decoration-none small">
                                    <i class="fas fa-plus-circle me-1"></i> Add more items from this restaurant
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="custom-card p-4 mb-3">
                            <h5 class="fw-bold mb-3">Apply Coupon</h5>
                            <div class="input-group mb-2">
                                <input type="text" id="coupon-input" class="form-control" placeholder="Promo code" value="${cart.couponCode || ''}">
                                <button class="btn btn-dark" onclick="applyCoupon()">Apply</button>
                            </div>
                            ${cart.couponCode ? `
                                <div class="d-flex justify-content-between align-items-center text-success small">
                                    <span><i class="fas fa-check-circle me-1"></i>Code '<strong>${cart.couponCode}</strong>' applied</span>
                                    <a href="javascript:void(0)" class="text-danger text-decoration-none" onclick="removeCoupon()">Remove</a>
                                </div>
                            ` : `
                                <small class="text-muted">Try: <code>WELCOME50</code>, <code>FEAST20</code>, <code>FREEDELIVERY</code></small>
                            `}
                        </div>

                        <div class="custom-card p-4">
                            <h5 class="fw-bold mb-3">Bill Details</h5>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Item Subtotal</span>
                                <span>₹${cart.subtotal.toFixed(2)}</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Delivery Fee</span>
                                <span>₹${cart.deliveryFee.toFixed(2)}</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Taxes & GST (5%)</span>
                                <span>₹${cart.taxAmount.toFixed(2)}</span>
                            </div>
                            ${cart.discountAmount > 0 ? `
                                <div class="d-flex justify-content-between mb-2 text-success">
                                    <span>Discount</span>
                                    <span>-₹${cart.discountAmount.toFixed(2)}</span>
                                </div>
                            ` : ''}
                            <hr>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="fw-bold fs-5">To Pay</span>
                                <span class="fw-bold fs-5 text-danger">₹${cart.grandTotal.toFixed(2)}</span>
                            </div>
                            <a href="/checkout.html" class="btn btn-primary w-100 py-2 fw-bold">Proceed to Checkout</a>
                        </div>
                    </div>
                `;
                updateCartBadge();
            } catch (err) {
                console.error(err);
            }
        }

        async function updateQty(itemId, newQty) {
            try {
                await apiCall(`/cart/items/${itemId}?quantity=${newQty}`, 'PUT');
                loadCart();
            } catch (e) {}
        }

        async function removeItem(itemId) {
            try {
                await apiCall(`/cart/items/${itemId}`, 'DELETE');
                showToast('Item removed', 'info');
                loadCart();
            } catch (e) {}
        }

        async function clearCart() {
            try {
                await apiCall('/cart/clear', 'DELETE');
                showToast('Cart cleared', 'info');
                loadCart();
            } catch (e) {}
        }

        async function applyCoupon() {
            const code = document.getElementById('coupon-input').value.trim();
            if (!code) return;
            try {
                await apiCall('/cart/apply-coupon', 'POST', { code });
                showToast('Coupon applied successfully!', 'success');
                loadCart();
            } catch (e) {}
        }

        async function removeCoupon() {
            try {
                await apiCall('/cart/remove-coupon', 'DELETE');
                showToast('Coupon removed', 'info');
                loadCart();
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
