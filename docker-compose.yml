services:
  mysql:
    image: mysql:8.0
    container_name: foodexpress-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-foodexpress_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - foodexpress-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodexpress-backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-foodexpress_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      JWT_SECRET: ${JWT_SECRET:-FoodExpressSuperSecretSigningKeyForJwtSecurityTokens2026SecureKeyWithAtLeast256BitsLength}
    ports:
      - "8085:8085"
    networks:
      - foodexpress-net

volumes:
  mysql_data:
    driver: local

networks:
  foodexpress-net:
    driver: bridge
